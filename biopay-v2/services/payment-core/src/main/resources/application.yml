server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/biopay?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:biopay}
    password: ${SPRING_DATASOURCE_PASSWORD:biopay_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

biopay:
  demo-mode: ${BIOPAY_DEMO_MODE:true}
  risk-url: ${BIOPAY_RISK_URL:http://localhost:8000}
  challenge-ttl-seconds: 90
